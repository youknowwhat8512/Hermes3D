name: hermes3d-office-bridge
version: 1.2.0
description: "Publish each agent's activity and finished turns onto the Hermes dashboard event bus so Hermes3D can show who is working and visualise conversations. Observation only — never alters a turn."
author: Hermes3D
kind: standalone
platforms:
  - linux
  - macos
  - windows
hooks:
  - pre_llm_call
  - post_llm_call
  - on_session_end
